name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Run Cypress
        # automationexercise.com sits behind Cloudflare, which occasionally
        # rate-limits/challenges traffic from shared CI runner IP ranges —
        # unrelated to whether the tests themselves are correct. A short
        # retry loop absorbs that without masking a real failure (a genuine
        # bug fails all 3 attempts the same way).
        run: |
          for attempt in 1 2 3; do
            npx cypress run --browser chrome && exit 0
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
